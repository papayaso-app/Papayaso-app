<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repartidor — Papayaso</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#ff6b00;--dark:#111;--white:#fff;--bg:#f7f7f7;
  --border:#e5e5e5;--muted:#888;--text:#111;
  --ok:#2d8a3e;--ok-bg:#f0faf2;
  --warn:#e65100;--warn-bg:#fff3e0;
  --info:#1565c0;--info-bg:#e3f2fd;
  --danger:#c62828;--danger-bg:#fdecea;
  --purple:#6a1b9a;--purple-bg:#f3e5f5;
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* Topbar */
.topbar{background:var(--dark);display:flex;align-items:center;gap:10px;padding:0 16px;height:54px;position:sticky;top:0;z-index:100;}
.t-name{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:900;color:var(--green);}
.t-spacer{flex:1;}
.t-badge{font-size:11px;font-weight:700;background:var(--green);color:#fff;padding:3px 10px;border-radius:100px;}
/* PIN screen */
.pin-screen{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:16px;padding:24px;}
.pin-box{background:#1a1a1a;border-radius:20px;padding:32px 24px;max-width:320px;width:100%;text-align:center;}
.pin-title{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;}
.pin-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:20px;}
.pin-input{width:100%;padding:14px;font-size:20px;font-weight:700;text-align:center;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;letter-spacing:6px;margin-bottom:16px;}
.pin-input:focus{outline:none;border-color:var(--green);}
.pin-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;}
.pin-err{color:#f44336;font-size:13px;margin-top:-8px;display:none;}
/* Content */
.content{padding:16px;max-width:600px;margin:0 auto;}
.section-head{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:900;margin-bottom:4px;}
.section-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
/* Order cards */
.ocard{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:12px;overflow:hidden;border-left:4px solid var(--border);}
.ocard.listo{border-left-color:var(--ok);}
.ocard.camino{border-left-color:var(--purple);}
.ocard.entregado{border-left-color:var(--muted);opacity:.6;}
.orow{padding:12px 14px;border-bottom:1px solid var(--border);}
.orow:last-child{border-bottom:none;}
.orow-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.onum{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:900;}
.ostate{font-size:10px;font-weight:700;padding:2px 9px;border-radius:100px;text-transform:uppercase;}
.s-listo{background:var(--ok-bg);color:var(--ok);}
.s-camino{background:var(--purple-bg);color:var(--purple);}
.s-entregado{background:#f5f5f5;color:#888;}
.oclient{font-size:13px;font-weight:600;flex:1;}
.oprice{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:900;color:var(--green);margin-left:auto;}
.oaddr{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.oitems{font-size:11px;color:var(--muted);}
.opay{font-size:11px;font-weight:600;background:var(--bg);padding:2px 8px;border-radius:100px;border:1px solid var(--border);}
/* Acciones */
.oactions{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;}
.btn{padding:9px 16px;border-radius:var(--rs);border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-green{background:var(--ok);color:#fff;}
.btn-purple{background:var(--purple);color:#fff;}
.btn-maps{background:#4285F4;color:#fff;}
.btn-wa{background:#25D366;color:#fff;}
.btn-sm{font-size:11px;padding:6px 12px;}
/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
/* Refresh bar */
.refresh-bar{display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:var(--rs);padding:10px 14px;margin-bottom:14px;border:1.5px solid var(--border);}
.refresh-lbl{font-size:12px;color:var(--muted);}
.refresh-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;animation:pulse 2s infinite;display:inline-block;margin-right:5px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.refresh-btn{background:var(--bg);border:1.5px solid var(--border);color:var(--text);font-family:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:var(--rs);cursor:pointer;}
/* Toast */
#toast-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;}
#toast{background:#333;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;display:none;white-space:nowrap;}
#toast.show{display:block;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div class="pin-screen" id="pin-screen">
  <div class="pin-box">
    <div style="font-size:40px;margin-bottom:10px">🛵</div>
    <div class="pin-title">Panel Repartidor</div>
    <div class="pin-sub">Papayaso — Ingresa tu PIN de acceso</div>
    <input class="pin-input" id="pin-input" type="password" maxlength="6" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()">
    <div class="pin-err" id="pin-err">PIN incorrecto. Inténtalo de nuevo.</div>
    <button class="pin-btn" onclick="checkPin()">Entrar →</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="t-name">🛵 Repartidor</div>
  <div class="t-spacer"></div>
  <span class="t-badge" id="pedidos-count">0 pendientes</span>
</div>

<!-- CONTENT -->
<div class="content" style="display:none" id="main-content">
  <div class="refresh-bar">
    <div><span class="refresh-dot"></span><span class="refresh-lbl">Actualización automática cada 10s</span></div>
    <button class="refresh-btn" onclick="cargarPedidos()">↻ Actualizar</button>
  </div>
  <div class="section-head">Pedidos activos</div>
  <div class="section-sub" id="last-update">Esperando datos...</div>
  <div id="pedidos-list"><div class="empty"><div class="empty-icon">⏳</div><div>Cargando pedidos...</div></div></div>
</div>

<!-- TOAST -->
<div id="toast-bar"><span id="toast"></span></div>

<script>
// ─────────────────────────────────────────────────────────────
// SUPABASE
// ─────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://mmnyxlsyizylivvikfuf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbnl4bHN5aXp5bGl2dmlrZnVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODg5MzQsImV4cCI6MjA5MTY2NDkzNH0.Ou5pNg5wf0TYqsfG2cxzMgb3lsQzYPA2za6UdzrtpnU';

const SB = {
  h: {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Prefer': 'return=representation'
  },
  async get(table, params) {
    const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
    if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
    const r = await fetch(url, { headers: this.h });
    if (!r.ok) { const e = await r.text(); console.error('[SB]',r.status,e); throw new Error(e); }
    return r.json();
  },
  async patch(table, id, body) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: 'PATCH', headers: this.h, body: JSON.stringify(body)
    });
    if (!r.ok) { const e = await r.text(); console.error('[SB]',r.status,e); throw new Error(e); }
    return r.json();
  }
};

// ─────────────────────────────────────────────────────────────
// PIN
// ─────────────────────────────────────────────────────────────
var RIDER_PIN = '1234'; // PIN por defecto — se sobreescribe con el de Supabase config

async function checkPin() {
  const pin = document.getElementById('pin-input').value.trim();
  // Leer PIN real desde localStorage del sistema (mismo que el admin guarda)
  try {
    const stored = localStorage.getItem('restaurante_v3');
    if (stored) {
      const data = JSON.parse(stored);
      if (data && data.config && data.config.riderPin) {
        RIDER_PIN = String(data.config.riderPin);
      }
    }
  } catch(e) {}

  if (pin === RIDER_PIN) {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    await cargarPedidos();
    setInterval(cargarPedidos, 10000);
  } else {
    const err = document.getElementById('pin-err');
    if (err) err.style.display = 'block';
    const inp = document.getElementById('pin-input');
    if (inp) { inp.value = ''; inp.focus(); }
  }
}

document.getElementById('pin-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPin();
});

// ─────────────────────────────────────────────────────────────
// CARGAR PEDIDOS (Listo + En camino)
// ─────────────────────────────────────────────────────────────
async function cargarPedidos() {
  try {
    const pedidos = await SB.get('pedidos', {
      select: '*',
      order: 'created_at.desc',
      limit: 50
    });

    const activos = (pedidos || []).filter(p =>
      p.estado === 'Listo' || p.estado === 'En camino'
    );

    const count = document.getElementById('pedidos-count');
    if (count) count.textContent = activos.length + ' pendiente' + (activos.length!==1?'s':'');

    const sub = document.getElementById('last-update');
    const now = new Date();
    if (sub) sub.textContent = 'Última actualización: ' + now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});

    renderPedidos(activos);
  } catch(e) {
    console.error('[Rep] Error cargando pedidos:', e);
    showToast('Error al cargar pedidos');
  }
}

function renderPedidos(pedidos) {
  const el = document.getElementById('pedidos-list');
  if (!el) return;

  if (!pedidos.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div><div style="font-weight:700;margin-bottom:6px">Sin pedidos pendientes</div><div style="font-size:13px">Todos los pedidos han sido entregados.</div></div>';
    return;
  }

  let html = '';
  for (const p of pedidos) {
    // Parsear items
    let items = [];
    try { items = typeof p.detalles_pedido === 'string' ? JSON.parse(p.detalles_pedido) : (p.detalles_pedido || []); } catch(e) {}

    const itemsTxt = items.map(it => (it.cantidad||it.qty||1) + 'x ' + (it.nombre||it.name||'')).join(' · ');
    const mapsLink = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent((p.direccion||'') + ', Medellín, Colombia') + '&travelmode=driving';
    const waPhone = (p.telefono||'').replace(/\D/g,'');
    const stateClass = p.estado === 'Listo' ? 'listo' : 'camino';
    const stateLbl = p.estado === 'Listo' ? 'Listo' : 'En camino';
    const stateCss = p.estado === 'Listo' ? 's-listo' : 's-camino';

    html += `<div class="ocard ${stateClass}">
      <div class="orow">
        <div class="orow-top">
          <span class="onum">#${p.id}</span>
          <span class="ostate ${stateCss}">${stateLbl}</span>
          <span class="oclient">${p.cliente||'Cliente'}</span>
          <span class="oprice">$${parseFloat(p.total||0).toLocaleString('es-CO')}</span>
        </div>
        ${p.telefono ? `<div class="oaddr">📱 ${p.telefono}</div>` : ''}
        <div class="oaddr">📍 ${p.direccion||'Sin dirección'}</div>
        ${p.referencia ? `<div class="oaddr">📌 Ref: ${p.referencia}</div>` : ''}
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px">
          <span class="opay">${p.metodo_pago||'Efectivo'}</span>
          ${p.cambio && p.cambio!=='Exacto' ? `<span class="opay" style="color:var(--ok)">Paga con: ${p.cambio}</span>` : ''}
        </div>
        ${itemsTxt ? `<div class="oitems" style="margin-top:6px">${itemsTxt}</div>` : ''}
        ${p.notas ? `<div class="oitems" style="margin-top:4px;color:var(--warn)">📝 ${p.notas}</div>` : ''}
      </div>
      <div class="oactions">
        <a href="${mapsLink}" target="_blank"><button class="btn btn-maps btn-sm">🗺 Maps</button></a>
        ${waPhone ? `<a href="https://wa.me/${waPhone.startsWith('57')?waPhone:'57'+waPhone}" target="_blank"><button class="btn btn-wa btn-sm">💬 WhatsApp</button></a>` : ''}
        ${p.estado === 'Listo' ? `<button class="btn btn-purple btn-sm" onclick="actualizarEstado(${p.id},'En camino')">🛵 Salir a entregar</button>` : ''}
        <button class="btn btn-green btn-sm" onclick="actualizarEstado(${p.id},'Entregado')">✅ Entregado</button>
      </div>
    </div>`;
  }
  el.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────
// ACTUALIZAR ESTADO
// ─────────────────────────────────────────────────────────────
async function actualizarEstado(id, nuevoEstado) {
  try {
    await SB.patch('pedidos', id, { estado: nuevoEstado });
    showToast(nuevoEstado === 'Entregado' ? '✅ Pedido entregado' : '🛵 En camino');
    await cargarPedidos();
  } catch(e) {
    console.error('[Rep] Error actualizando estado:', e);
    alert('❌ Error al actualizar estado:\n' + e.message + '\n\nVerifica tu conexión o los permisos en Supabase (RLS).');
  }
}

// ─────────────────────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────────────────────
var toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
