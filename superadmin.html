<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin — Papayaso SaaS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#ff6b00;--brand2:#e05a00;--brand-bg:#fff3e8;--brand-bd:rgba(255,107,0,.3);
  --dark:#0d0d0d;--dark2:#1a1a1a;--dark3:#222;
  --white:#fff;--bg:#f5f5f5;--border:#e5e5e5;--border2:#ccc;
  --text:#111;--muted:#777;
  --ok:#2d8a3e;--ok-bg:#f0faf2;--ok-bd:#a5d6a7;
  --danger:#c62828;--danger-bg:#fdecea;--danger-bd:#f5a5a5;
  --info:#1565c0;--info-bg:#e3f2fd;
  --warn:#e65100;--warn-bg:#fff3e0;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* Login eliminado — redirige a login.html */

/* ═══════════ TOPBAR ═══════════ */
.topbar{
  background:var(--dark);padding:0 20px;height:54px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(255,255,255,.07);
}
.t-logo{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:900;color:var(--brand);}
.t-sep{color:rgba(255,255,255,.15);font-size:18px;}
.t-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);}
.t-spacer{flex:1;}
.t-user{font-size:12px;color:rgba(255,255,255,.4);}
.t-logout{
  padding:6px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:var(--rs);font-family:inherit;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;
}
.t-logout:hover{background:rgba(255,255,255,.15);color:#fff;}

/* ═══════════ LAYOUT ═══════════ */
#app{display:block;}
.page{padding:28px 20px;max-width:1100px;margin:0 auto;}

/* ═══════════ STATS ═══════════ */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.sc{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:18px;}
.sc-val{font-family:'Montserrat',sans-serif;font-size:30px;font-weight:900;line-height:1;margin-bottom:4px;}
.sc-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.sc-val.orange{color:var(--brand);}
.sc-val.green{color:var(--ok);}
.sc-val.red{color:var(--danger);}

/* ═══════════ SECTION ═══════════ */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;}
.sec-hd h2{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;}
.sec-hd p{font-size:12px;color:var(--muted);margin-top:2px;}

/* ═══════════ BOTONES ═══════════ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-p{background:var(--brand);color:#fff;}.btn-p:hover{background:var(--brand2);}
.btn-g{background:var(--white);border:1.5px solid var(--border);color:var(--muted);}.btn-g:hover{color:var(--text);}
.btn-ok{background:var(--ok);color:#fff;}
.btn-d{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11px;}

/* ═══════════ FORMULARIO NUEVO COMERCIO ═══════════ */
.card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:24px;}
.card h3{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fg{margin-bottom:0;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.fg input,.fg select{width:100%;padding:10px 13px;background:var(--white);border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;color:var(--text);transition:border-color .2s;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--brand);}
.fg-full{grid-column:1/-1;}
.form-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.slug-hint{font-size:11px;color:var(--muted);margin-top:4px;}
.slug-preview{color:var(--brand);font-weight:700;}

/* ═══════════ TABLA DE COMERCIOS ═══════════ */
.table-wrap{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:24px;}
.tbl-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1.5px solid var(--border);background:var(--bg);}
.tbl-header h3{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:11px 16px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:1.5px solid var(--border);background:var(--bg);}
.tbl td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:#fafafa;}
.tbl .name-cell{font-weight:700;}
.tbl .slug-cell{font-family:'Courier New',monospace;font-size:12px;color:var(--info);}
.tbl .plan-cell{}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.badge-activo{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd);}
.badge-inactivo{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd);}
.badge-plan-pro{background:var(--brand-bg);color:var(--brand);border:1px solid var(--brand-bd);}
.badge-plan-basico{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.badge-plan-enterprise{background:#f3e5f5;color:#6a1b9a;border:1px solid rgba(106,27,154,.3);}

/* Acciones en tabla */
.act-row{display:flex;gap:5px;flex-wrap:wrap;}

/* Toggle activo */
.tog{width:36px;height:20px;border-radius:100px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.tog.on{background:var(--ok);}.tog.off{background:#ccc;}
.tog-th{position:absolute;top:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .2s;pointer-events:none;}
.tog.on .tog-th{left:18px;}.tog.off .tog-th{left:2px;}

/* Empty state */
.empty-state{padding:50px;text-align:center;color:var(--muted);}
.empty-icon{font-size:44px;margin-bottom:14px;}
.empty-title{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;margin-bottom:6px;color:var(--text);}

/* Toast */
#toast{position:fixed;top:70px;right:18px;z-index:9999;background:var(--dark);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.25);}
#toast.show{opacity:1;}

/* Spinner */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,107,0,.2);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:700px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .fg-full{grid-column:1;}
  .tbl th:nth-child(3),.tbl td:nth-child(3){display:none;}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     PANTALLA LOGIN
══════════════════════════════════════ -->
<!-- ══════════════════════════════════════
     APP PRINCIPAL — el guard redirige a login.html si no hay sesión
══════════════════════════════════════ -->
<div id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="t-logo">Papayaso</div>
    <div class="t-sep">·</div>
    <div class="t-title">Super Admin</div>
    <div class="t-spacer"></div>
    <span class="t-user" id="sa-user-email"></span>
    <button class="t-logout" onclick="saLogout()">Salir ↗</button>
  </div>

  <!-- PÁGINA -->
  <div class="page">

    <!-- STATS -->
    <div class="stats-row">
      <div class="sc">
        <div class="sc-val orange" id="stat-total">—</div>
        <div class="sc-lbl">🏪 Comercios totales</div>
      </div>
      <div class="sc">
        <div class="sc-val green" id="stat-activos">—</div>
        <div class="sc-lbl">✅ Activos</div>
      </div>
      <div class="sc">
        <div class="sc-val red" id="stat-inactivos">—</div>
        <div class="sc-lbl">🔴 Inactivos</div>
      </div>
      <div class="sc">
        <div class="sc-val" id="stat-pro">—</div>
        <div class="sc-lbl">⭐ Plan Pro/Enterprise</div>
      </div>
    </div>

    <!-- FORMULARIO NUEVO COMERCIO -->
    <div class="card">
      <h3>➕ Registrar nuevo comercio</h3>
      <div class="form-grid">

        </div>
        <div class="fg">
          <label>WhatsApp</label>
          <input type="text" id="nc-wa" placeholder="573001234567">

          <label>Plan</label>
          <select id="nc-plan">
            <option value="basico">Básico</option>

          <input type="email" id="nc-email" placeholder="dueño@restaurante.com">

          <input type="password" id="nc-password" placeholder="Mín. 8 caracteres" autocomplete="new-password">

          <label>Dirección</label>
          <input type="text" id="nc-dir" placeholder="Calle 123 # 45-67, Medellín">
        </div>
        <div class="fg fg-full">

          <input type="text" id="nc-desc" placeholder="El mejor sabor de la ciudad...">
        </div>
      </div>
      <div class="form-footer">
        <button class="btn btn-g" onclick="limpiarFormulario()">Limpiar</button>
        <button class="btn btn-p" id="nc-btn" onclick="crearComercio()">✚ Crear comercio</button>
      </div>
      <div id="nc-msg" style="margin-top:12px;font-size:13px;font-weight:600;display:none;"></div>
    </div>

    <!-- TABLA DE COMERCIOS -->
    <div class="table-wrap">
      <div class="tbl-header">
        <div>
          <h3>🏪 Comercios registrados</h3>
        </div>
        <button class="btn btn-g btn-sm" onclick="cargarComercios()">↻ Actualizar</button>
      </div>

      <div id="comercios-table-wrap">
        <div class="empty-state">
          <div class="spinner"></div>
          <div style="margin-top:14px;color:var(--muted);">Cargando comercios...</div>
        </div>
      </div>
    </div>

  </div><!-- .page -->
</div><!-- #app -->

<!-- TOAST -->
<div id="toast"></div>

<!-- ══════════════════════════════════════
     SCRIPTS
══════════════════════════════════════ -->
<script>
'use strict';

// ── Constantes ────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://mmnyxlsyizylivvikfuf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbnl4bHN5aXp5bGl2dmlrZnVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODg5MzQsImV4cCI6MjA5MTY2NDkzNH0.Ou5pNg5wf0TYqsfG2cxzMgb3lsQzYPA2za6UdzrtpnU';
// ══════════════════════════════════════════════════════════════════════
// PERSISTENCIA DE SESIÓN — equivalente a createClient con:
//   auth: { persistSession: true, autoRefreshToken: true }
//
// ▸ localStorage → sesión persiste entre recargas y cierres de tab.
// ▸ Auto-refresh cada 15 min → autoRefreshToken: true.
// ▸ Retry en 401 → si un fetch recibe 401, renueva y reintenta.
// ▸ Token de 86400s (24h) configurado en Supabase.
// ══════════════════════════════════════════════════════════════════════
const SA_SESSION_KEY      = 'papayaso_superadmin_session'; // localStorage
const SA_REFRESH_MARGEN   = 10 * 60 * 1000;  // renovar con 10 min de margen
const SA_AUTO_REFRESH_MS  = 15 * 60 * 1000;  // polling cada 15 min

let _saSession          = null;
let _saAutoRefreshTimer = null;

// ── Renovar token del superadmin — refreshSession() equivalente ──────
async function _saRefreshSession() {
  const session = _saSession || _saLeerSesion();
  if (!session || !session.refresh_token) {
    console.warn('[SA] refreshSession: sin refresh_token');
    return false;
  }
  try {
    console.log('[SA] Renovando token...');
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body:    JSON.stringify({ refresh_token: session.refresh_token })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || 'No se pudo renovar');
    const newSession = {
      access_token:  data.access_token,
      refresh_token: data.refresh_token || session.refresh_token,
      expires_at:    Date.now() + (data.expires_in || 86400) * 1000,
      user:          data.user || session.user
    };
    _saSession = newSession;
    _saGuardarSesion(newSession);
    console.log('[SA] ✅ Token renovado. Expira en:', Math.round((newSession.expires_at - Date.now()) / 60000), 'min');
    return true;
  } catch(e) {
    console.error('[SA] Error renovando token:', e.message);
    return false;
  }
}

// ── Auto-refresh periódico ───────────────────────────────────────────
function _saIniciarAutoRefresh() {
  if (_saAutoRefreshTimer) clearInterval(_saAutoRefreshTimer);
  _saAutoRefreshTimer = setInterval(async function() {
    if (!_saSession) return;
    const restante = (_saSession.expires_at || 0) - Date.now();
    if (restante < SA_REFRESH_MARGEN) {
      console.log('[SA] Auto-refresh: renovando token (expira en', Math.round(restante/60000), 'min)...');
      await _saRefreshSession();
    }
  }, SA_AUTO_REFRESH_MS);
  console.log('[SA] Auto-refresh iniciado — cada', SA_AUTO_REFRESH_MS / 60000, 'min');
}

function _saDetenerAutoRefresh() {
  if (_saAutoRefreshTimer) { clearInterval(_saAutoRefreshTimer); _saAutoRefreshTimer = null; }
}

// ── localStorage para sesión persistente ────────────────────────────
function _saGuardarSesion(s) {
  try { localStorage.setItem(SA_SESSION_KEY, JSON.stringify(s)); } catch(e) {}
}
function _saLeerSesion() {
  try { const r = localStorage.getItem(SA_SESSION_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function _saLimpiarSesion() {
  try { localStorage.removeItem(SA_SESSION_KEY); } catch(e) {}
  _saSession = null;
}

// ── Cliente Supabase — con retry automático en 401 ───────────────────
// Si cualquier llamada REST recibe 401, se llama _saRefreshSession()
// y se reintenta UNA vez — autoRefreshToken: true equivalente.
const SB = {
  _h() {
    const tok = (_saSession && _saSession.access_token) ? _saSession.access_token : SUPABASE_KEY;
    return {
      'Content-Type':  'application/json',
      'apikey':        SUPABASE_KEY,
      'Authorization': 'Bearer ' + tok,
      'Prefer':        'return=representation'
    };
  },
  async _withRetry(fn) {
    const r = await fn();
    if (r.status === 401) {
      console.warn('[SA-SB] 401 detectado — refreshSession() automático...');
      const ok = await _saRefreshSession();
      if (ok) { console.log('[SA-SB] Token renovado — reintentando...'); return fn(); }
      console.error('[SA-SB] refreshSession falló — no se puede reintentar');
    }
    return r;
  },
  async get(table, params = {}) {
    const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
    const r = await this._withRetry(() => fetch(url, { headers: this._h() }));
    if (!r.ok) { const e = await r.text(); throw new Error(`${r.status}: ${e}`); }
    return r.json();
  },
  async post(table, body) {
    const r = await this._withRetry(() => fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST', headers: this._h(), body: JSON.stringify(body)
    }));
    if (!r.ok) { const e = await r.text(); throw new Error(`${r.status}: ${e}`); }
    return r.json();
  },
  async patch(table, filter, body) {
    const r = await this._withRetry(() => fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
      method: 'PATCH', headers: this._h(), body: JSON.stringify(body)
    }));
    if (!r.ok) { const e = await r.text(); throw new Error(`${r.status}: ${e}`); }
    return r.json();
  },
  async del(table, filter) {
    const r = await this._withRetry(() => fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
      method: 'DELETE', headers: this._h()
    }));
    if (!r.ok) { const e = await r.text(); throw new Error(`${r.status}: ${e}`); }
    return true;
  },
  // Auth helpers — sin retry (son llamadas de auth, no de datos)
  async authPost(endpoint, body) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Auth error');
    return data;
  }
};

// ══════════════════════════════════════════════════════════════════════
// AUTENTICACIÓN SUPER ADMIN
// ══════════════════════════════════════════════════════════════════════
// Stubs eliminados — ya no hay formulario de login en este archivo.
function _saSetErr(msg)      { console.warn('[SA] Error auth:', msg); }
function _saSetLoading(on)   { /* sin formulario embebido */ }
// ── Guardia de acceso — única puerta de entrada ─────────────────────
function _mostrarApp(session) {
  // El #app siempre es visible; solo actualizar el email en el topbar
  var eu = document.getElementById('sa-user-email');
  if (eu && session && session.user) eu.textContent = session.user.email;
}

function _mostrarLogin(err) {
  // GUARDIA: redirigir a login.html — NO pintar formulario en esta página.
  console.log('[SA] Redirigiendo a login.html' + (err ? ' — ' + err : ''));
  _saDetenerAutoRefresh();
  _saLimpiarSesion();
  window.location.href = 'login.html';
}

// ── Email y roles autorizados para Super Admin ─────────────────────
const SUPER_ADMIN_ALLOWED_EMAILS = [
  'escobardiego1992@hotmail.com'
];

function _esSuperAdmin(data) {
  var user    = data.user || {};
  var email   = (user.email || '').toLowerCase().trim();
  var meta    = user.user_metadata  || {};
  var appMeta = user.app_metadata   || {};
  var role    = meta.role || appMeta.role || '';

  // Autorizado si: el email está en la lista O el role es super_admin
  return SUPER_ADMIN_ALLOWED_EMAILS.indexOf(email) >= 0 || role === 'super_admin';
}

// ── saLogin eliminada — el login lo gestiona login.html ──────────
// Si por algún código heredado se llama saLogin(), redirigir al login.
function saLogin() {
  console.warn('[SA] saLogin() llamado en superadmin.html — redirigiendo a login.html');
  window.location.href = 'login.html';
}

async function saLogout() {
  if (!confirm('¿Cerrar sesión del super admin?')) return;
  try {
    if (_saSession && _saSession.access_token) {
      await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _saSession.access_token }
      });
    }
  } catch(e) {}
  _saDetenerAutoRefresh();          // ← cancelar auto-refresh
  _saLimpiarSesion();               // ← limpiar localStorage
  // Redirigir al login centralizado
  window.location.href = 'login.html';
}

// ── GUARDIA DE SESIÓN — única puerta de entrada ─────────────────────
// Lee la sesión de localStorage. Cualquier condición sin sesión válida
// redirige SIEMPRE a login.html. No hay formulario embebido aquí.
(async function saOnLoad() {
  const s = _saLeerSesion();

  // Sin sesión → redirigir al login
  if (!s || !s.access_token) {
    console.log('[SA] Sin sesión en localStorage — redirigiendo a login.html');
    _saLimpiarSesion();
    window.location.href = 'login.html';
    return;
  }

  // ── Bloqueo de seguridad: solo super_admin ──────────────────────
  if (!_esSuperAdmin({ user: s.user })) {
    console.warn('[SA] Sesión no es super_admin — redirigiendo a login.html');
    _saLimpiarSesion();
    window.location.href = 'login.html';
    return;
  }

  const restante = (s.expires_at || 0) - Date.now();

  // ── Token vigente con margen amplio → entrar directamente ─────────
  if (restante > SA_REFRESH_MARGEN) {
    console.log('[SA] Sesión activa —', s.user && s.user.email,
      '| expira en:', Math.round(restante / 60000), 'min');
    _saSession = s;
    _saIniciarAutoRefresh();
    _mostrarApp(s);
    cargarComercios();
    return;
  }

  // ── Token próximo a expirar o caducado → renovar primero ──────────
  if (s.refresh_token) {
    console.log('[SA] Token próximo a expirar — renovando en onLoad...');
    _saSession = s;
    const ok = await _saRefreshSession();
    if (ok && _saSession) {
      if (!_esSuperAdmin({ user: _saSession.user })) {
        console.warn('[SA] Sesión renovada no es super_admin — redirigiendo a login.html');
        _saLimpiarSesion();
        window.location.href = 'login.html';
        return;
      }
      console.log('[SA] ✅ Token renovado en onLoad');
      _saIniciarAutoRefresh();
      _mostrarApp(_saSession);
      cargarComercios();
    } else {
      // refreshSession falló → redirigir al login
      console.warn('[SA] No se pudo renovar — redirigiendo a login.html');
      _saLimpiarSesion();
      window.location.href = 'login.html';
    }
  } else {
    // Sin refresh_token → redirigir al login
    console.warn('[SA] Sin refresh_token — redirigiendo a login.html');
    _saLimpiarSesion();
    window.location.href = 'login.html';
  }
})();

// ══════════════════════════════════════════════════════════════════════
// CARGAR Y RENDERIZAR COMERCIOS
// ══════════════════════════════════════════════════════════════════════
let _comercios = [];

async function cargarComercios() {
  const wrap = document.getElementById('comercios-table-wrap');
  if (wrap) wrap.innerHTML = '<div class="empty-state"><div class="spinner"></div><div style="margin-top:14px;color:var(--muted)">Cargando...</div></div>';
  try {
    const rows = await SB.get('comercios', {
      select: 'id,nombre,slug,whatsapp,plan,activo,user_id,created_at',
      order:  'created_at.desc'
    });
    _comercios = rows || [];
    renderComercios(_comercios);
    actualizarStats(_comercios);
    console.log('[SA] Comercios cargados:', _comercios.length);
  } catch(e) {
    console.error('[SA] Error cargando comercios:', e.message);
    if (wrap) wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error al cargar</div><div>${esc(e.message)}</div></div>`;
  }
}

function actualizarStats(comercios) {
  const total     = comercios.length;
  const activos   = comercios.filter(c => c.activo).length;
  const inactivos = total - activos;
  const premium   = comercios.filter(c => c.plan === 'pro' || c.plan === 'enterprise').length;
  setEl('stat-total',    total);
  setEl('stat-activos',  activos);
  setEl('stat-inactivos', inactivos);
  setEl('stat-pro',      premium);
}

function renderComercios(comercios) {
  const wrap = document.getElementById('comercios-table-wrap');
  if (!wrap) return;
  if (!comercios.length) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🏪</div>
      <div class="empty-title">Sin comercios registrados</div>
      <div style="font-size:13px;color:var(--muted)">Crea el primero usando el formulario de arriba.</div>
    </div>`;
    return;
  }
  let html = `<table class="tbl"><thead><tr>
    <th>Comercio</th>
    <th>Slug / URL</th>
    <th>Plan</th>
    <th>Estado</th>
    <th>Acciones</th>
  </tr></thead><tbody>`;

  for (const c of comercios) {
    const planCls = c.plan === 'pro' ? 'badge-plan-pro' : c.plan === 'enterprise' ? 'badge-plan-enterprise' : 'badge-plan-basico';
    const fecha   = c.created_at ? new Date(c.created_at).toLocaleDateString('es-CO') : '—';
    const menuUrl = `menu.html?rest=${encodeURIComponent(c.slug)}`;
    const admUrl  = `admin.html?rest=${encodeURIComponent(c.slug)}`;
    const repUrl  = `repartidor.html?rest=${encodeURIComponent(c.slug)}`;

    html += `<tr>
      <td>
        <div class="name-cell">${esc(c.nombre)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Creado: ${fecha}</div>
      </td>
      <td>
        <div class="slug-cell">${esc(c.slug)}</div>
        <div style="margin-top:4px;display:flex;gap:5px;flex-wrap:wrap;">
          <a href="${menuUrl}" target="_blank" style="font-size:10px;color:var(--brand);font-weight:700;text-decoration:none;">🍔 Menú</a>
          <span style="color:var(--border)">·</span>
          <a href="${admUrl}"  target="_blank" style="font-size:10px;color:var(--info);font-weight:700;text-decoration:none;">⚙️ Admin</a>
          <span style="color:var(--border)">·</span>
          <a href="${repUrl}"  target="_blank" style="font-size:10px;color:var(--ok);font-weight:700;text-decoration:none;">🛵 Rep.</a>
        </div>
      </td>
      <td><span class="badge ${planCls}">${esc(c.plan || 'basico')}</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="tog ${c.activo ? 'on' : 'off'}" onclick="toggleActivo('${c.id}',${c.activo})" title="${c.activo ? 'Desactivar' : 'Activar'}">
            <div class="tog-th"></div>
          </button>
          <span class="badge ${c.activo ? 'badge-activo' : 'badge-inactivo'}">${c.activo ? 'Activo' : 'Inactivo'}</span>
        </div>
      </td>
      <td>
        <div class="act-row">
          <select class="btn btn-g btn-xs" onchange="cambiarPlan('${c.id}', this.value)" title="Cambiar plan">
            <option value="basico"      ${c.plan==='basico'      ? 'selected':''}>Básico</option>
            <option value="pro"         ${c.plan==='pro'         ? 'selected':''}>Pro</option>
            <option value="enterprise"  ${c.plan==='enterprise'  ? 'selected':''}>Enterprise</option>
          </select>
          <button class="btn btn-d btn-xs" onclick="eliminarComercio('${c.id}','${esc(c.nombre)}')">🗑</button>
        </div>
      </td>
    </tr>`;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════════════
// CREAR NUEVO COMERCIO
// ══════════════════════════════════════════════════════════════════════
function generarSlug() {
  const nombre = (document.getElementById('nc-nombre') || {}).value || '';
  const slug = nombre
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')  // quitar tildes
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .substring(0, 40);
  const slugEl = document.getElementById('nc-slug');
  if (slugEl) slugEl.value = slug;
  const prev = document.getElementById('slug-preview');
  if (prev) prev.textContent = slug ? `/menu.html?rest=${slug}` : '/menu.html?rest=...';
}

document.addEventListener('DOMContentLoaded', function() {
  const slugEl = document.getElementById('nc-slug');
  if (slugEl) {
    slugEl.addEventListener('input', function() {
      const prev = document.getElementById('slug-preview');
      if (prev) prev.textContent = this.value ? `/menu.html?rest=${this.value}` : '/menu.html?rest=...';
    });
  }
});

async function crearComercio() {
  const gv  = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const nombre = gv('nc-nombre');
  const slug   = gv('nc-slug').toLowerCase().replace(/[^a-z0-9-]/g,'');
  const wa     = gv('nc-wa').replace(/\D/g,'');
  const plan   = gv('nc-plan') || 'basico';
  const email  = gv('nc-email');
  const dir    = gv('nc-dir');
  const desc   = gv('nc-desc');

  const msgEl = document.getElementById('nc-msg');
  const setMsg = (txt, ok=false) => {
    if (!msgEl) return;
    msgEl.style.display = 'block';
    msgEl.style.color = ok ? 'var(--ok)' : 'var(--danger)';
    msgEl.textContent = txt;
  };

  if (!nombre) { setMsg('⚠️ El nombre del comercio es obligatorio.'); return; }
  if (!slug)   { setMsg('⚠️ El slug es obligatorio (ej: mi-restaurante).'); return; }
  if (!/^[a-z0-9][a-z0-9-]{0,39}$/.test(slug)) { setMsg('⚠️ El slug solo puede tener letras minúsculas, números y guiones.'); return; }

  // Verificar slug único en memoria
  if (_comercios.some(c => c.slug === slug)) {
    setMsg(`⚠️ Ya existe un comercio con el slug "${slug}".`);
    return;
  }

  const btn = document.getElementById('nc-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creando...'; }
  if (msgEl) msgEl.style.display = 'none';

  const password = (document.getElementById('nc-password') || {}).value || '';

  try {
    let userId = null;
    let authWarning = '';

    // ── PASO 1: Crear cuenta en Supabase Auth con signUp ────────────────
    // Se usa el endpoint /auth/v1/signup para crear el acceso del restaurante.
    // Esto requiere que la anon key tenga permisos de signUp habilitados en Supabase
    // (Authentication → Providers → Email → Enable Sign Ups).
    if (email) {
      if (!password || password.length < 8) {
        setMsg('⚠️ La contraseña debe tener al menos 8 caracteres.', false);
        if (btn) { btn.disabled = false; btn.textContent = '✚ Crear comercio'; }
        return;
      }
      try {
        const signUpData = await SB.authPost('signup', {
          email:    email,
          password: password,
          data: {
            // user_metadata: info útil para identificar al dueño
            role:           'admin',
            comercio_slug:  slug,
            comercio_nombre: nombre
          }
        });

        if (signUpData.user && signUpData.user.id) {
          userId = signUpData.user.id;
          console.log('[SA] ✅ Usuario Auth creado:', email, '| id:', userId);

          // Verificar si requiere confirmación de email
          if (signUpData.user.identities && signUpData.user.identities.length === 0) {
            authWarning = ' ⚠️ El email ya estaba registrado en Auth.';
          } else if (!signUpData.session) {
            authWarning = ' 📧 Se envió un correo de confirmación al dueño.';
          }
        }
      } catch(authErr) {
        console.warn('[SA] Error en signUp Auth:', authErr.message);
        if (authErr.message.includes('already registered') || authErr.message.includes('already been registered')) {
          authWarning = ' ⚠️ El email ya tenía cuenta en Auth (no se modificó la contraseña existente).';
          // Intentar obtener el user_id buscando en comercios por email
          // (no podemos listar users con anon key, se deja null)
          userId = null;
        } else {
          // Error inesperado en Auth — continuar creando el comercio de todas formas
          authWarning = ' ⚠️ No se pudo crear la cuenta Auth: ' + authErr.message;
        }
      }
    }

    // ── PASO 2: Insertar el comercio en la tabla comercios ───────────────
    const body = {
      nombre:      nombre,
      slug:        slug,
      whatsapp:    wa       || null,
      direccion:   dir      || null,
      descripcion: desc     || null,
      plan:        plan,
      activo:      true,
      user_id:     userId   || null   // vincula el comercio con la cuenta Auth
    };

    const result = await SB.post('comercios', body);
    const nuevo  = result && result[0] ? result[0] : null;

    if (nuevo) {
      const mensajeOk =
        '✅ Comercio "' + nombre + '" creado con ID: ' + nuevo.id +
        '\n\nURL del menú: menu.html?rest=' + slug +
        (email ? '\nAcceso Admin: admin.html?rest=' + slug : '') +
        authWarning;
      setMsg(mensajeOk, true);
      showToast('✅ Comercio creado');
      limpiarFormulario();
      await cargarComercios();
    }
  } catch(e) {
    console.error('[SA] Error creando comercio:', e.message);
    if (e.message.includes('duplicate') || e.message.includes('unique') || e.message.includes('409')) {
      setMsg('⚠️ Ya existe un comercio con ese slug. Elige otro.');
    } else {
      setMsg('❌ Error: ' + e.message);
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '✚ Crear comercio'; }
  }
}

function limpiarFormulario() {
  ['nc-nombre','nc-slug','nc-wa','nc-email','nc-password','nc-dir','nc-desc'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const plan = document.getElementById('nc-plan');
  if (plan) plan.value = 'pro';
  const prev = document.getElementById('slug-preview');
  if (prev) prev.textContent = '/menu.html?rest=...';
  const msgEl = document.getElementById('nc-msg');
  if (msgEl) msgEl.style.display = 'none';
}

// ══════════════════════════════════════════════════════════════════════
// TOGGLE ACTIVO / INACTIVO
// ══════════════════════════════════════════════════════════════════════
async function toggleActivo(id, estadoActual) {
  const nuevoEstado = !estadoActual;
  const label = nuevoEstado ? 'activar' : 'desactivar';
  const c = _comercios.find(x => x.id === id);
  if (!confirm(`¿${label.charAt(0).toUpperCase() + label.slice(1)} "${c ? c.nombre : id}"?`)) return;
  try {
    await SB.patch('comercios', `id=eq.${id}`, { activo: nuevoEstado });
    showToast(nuevoEstado ? '✅ Comercio activado' : '🔴 Comercio desactivado');
    await cargarComercios();
  } catch(e) {
    alert('❌ Error al actualizar: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════════════════════
// CAMBIAR PLAN
// ══════════════════════════════════════════════════════════════════════
async function cambiarPlan(id, nuevoPlan) {
  try {
    await SB.patch('comercios', `id=eq.${id}`, { plan: nuevoPlan });
    showToast('Plan actualizado a ' + nuevoPlan);
    await cargarComercios();
  } catch(e) {
    alert('❌ Error al actualizar plan: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════════════════════
// ELIMINAR COMERCIO
// ══════════════════════════════════════════════════════════════════════
async function eliminarComercio(id, nombre) {
  if (!confirm(`⚠️ ELIMINAR PERMANENTEMENTE "${nombre}"?\n\nEsto eliminará el comercio. Los pedidos y productos asociados pueden quedar huérfanos si no has configurado ON DELETE CASCADE.\n\nEscribe "ELIMINAR" para confirmar.`)) return;
  const confirmacion = prompt(`Escribe ELIMINAR para confirmar la eliminación de "${nombre}":`);
  if (confirmacion !== 'ELIMINAR') { showToast('Cancelado'); return; }
  try {
    await SB.del('comercios', `id=eq.${id}`);
    showToast('🗑 Comercio eliminado');
    await cargarComercios();
  } catch(e) {
    alert('❌ Error al eliminar: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════════════════════
// UTILIDADES
// ══════════════════════════════════════════════════════════════════════
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function setEl(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = String(val);
}

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t && t.classList.remove('show'), 2800);
}
</script>
